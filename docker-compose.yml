services:
  backend_jobscraper:
    image: backend_jobscraper
    build: ./job-scraper-backend
    restart: unless-stopped
    networks:
      - caddy_network
    environment:
      - PORT=5000

  frontend_jobscraper:
    image: frontend_jobscraper
    build: ./job-scraper-frontend
    restart: unless-stopped
    networks:
      - caddy_network
    depends_on:
      - backend_jobscraper

networks:
  caddy_network:
    external: true
